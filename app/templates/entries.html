<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entries — Knowledge Base</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="container">
    {% include "partials/nav.html" %}

    <section>
      <h2>
        Processed Entries
        <span class="htmx-indicator" id="entries-spinner" style="font-size:0.75rem; color:var(--muted); font-weight:400; letter-spacing:0; text-transform:none; margin-left:0.5rem;">
          refreshing<span class="spinner"></span>
        </span>
      </h2>
      <div
        id="entries-panel"
        hx-get="/api/entries/table"
        hx-trigger="load, every 15s"
        hx-swap="innerHTML"
        hx-indicator="#entries-spinner"
      >
        <p style="color:var(--muted); font-size:0.875rem;">Loading...</p>
      </div>
    </section>

    <footer>
      Knowledge Base &mdash; Phase 2 &mdash; self-hosted
    </footer>
  </div>

  <script>
    function _esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function toggleEntryDetail(id, row) {
      const detail = document.getElementById(id);
      if (!detail) return;
      const arrow = row ? row.querySelector('td:last-child') : null;
      if (detail.style.display === 'none') {
        detail.style.display = '';
        if (arrow) arrow.textContent = '▼';
      } else {
        detail.style.display = 'none';
        if (arrow) arrow.textContent = '▶';
      }
    }
  </script>
</body>
</html>
