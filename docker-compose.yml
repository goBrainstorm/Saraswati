services:
  app:
    build: .
    container_name: saraswati-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./input:/app/input
      - ./cache:/app/cache
      - ./data:/app/data
    env_file:
      - .env
    # Bind all interfaces so published ports work (127.0.0.1 only listens inside the container)
    environment:
      HOST: "0.0.0.0"
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: saraswati-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
